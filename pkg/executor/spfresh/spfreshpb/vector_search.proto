syntax = "proto3";

import "github.com/gogo/protobuf@v1.3.2/gogoproto/gogo.proto";

option go_package = "spfreshpb";
option (gogoproto.goproto_getters_all) = false;

// ColumnInfo is wire-compatible with tipb.ColumnInfo.
// IMPORTANT: field numbers must not change.
message ColumnInfo {
  int64 column_id = 1;
  int32 tp = 2;
  int32 collation = 3;
  int32 columnLen = 4;
  int32 decimal = 5;
  int32 flag = 6;
  repeated string elems = 7;
  bytes default_val = 8;
  bool pk_handle = 21;
  bool array = 22;
}

message VectorSearchRequest {
  uint32 keyspace_id = 1;
  int64 table_id = 2;
  int64 index_id = 3;
  uint64 start_ts = 4;
  uint32 top_k = 5;

  // query_vector_f32_le is f32 little-endian bytes, without the dims prefix.
  bytes query_vector_f32_le = 6;

  repeated ColumnInfo required_columns = 7;

  // Optional tuning/debug parameters.
  uint32 max_batches = 8;
  uint32 oversample_factor = 9;
  bool debug = 10;
}

message VectorSearchResponse {
  repeated VectorSearchRow rows = 1;
  VectorSearchStats stats = 2;
}

message VectorSearchRow {
  bytes handle_bytes = 1;
  float distance = 2;
  repeated bytes column_values = 3;
}

message VectorSearchStats {
  uint64 partitions_scanned = 1;
  uint64 vectors_scanned = 2;
  uint64 table_lookup_keys = 3;
  uint64 table_lookup_bytes = 4;
}

