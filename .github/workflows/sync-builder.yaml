name: Sync Builder

on:
  workflow_dispatch:

concurrency:
  # Only one instance of this workflow can run at a time
  group: sync-builder
  cancel-in-progress: true

jobs:
  sync-image:
    runs-on: amd64
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: hub.pingcap.net
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Get Regctl
        run: |
          curl -sL -o regctl-linux-amd64 https://github.com/regclient/regclient/releases/download/v0.4.0/regctl-linux-amd64
          chmod +x regctl-linux-amd64
      - name: Sync Golang Manifest
        run: |
          ./regctl-linux-amd64 image copy docker.io/library/golang:1.24-bullseye hub.pingcap.net/keyspace/builder/golang:1.24-bullseye -v info
      - name: Sync Debian Manifest
        run: |
          ./regctl-linux-amd64 image copy docker.io/library/debian:bullseye-slim hub.pingcap.net/keyspace/builder/debian:bullseye-slim -v info
