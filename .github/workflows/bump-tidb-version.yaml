name: Bump TiDB Version to aws-shared-provider

# This workflow will create a new pull request to bump the TiDB version to aws-shared-provider.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump, like commit sha"
        required: true
      bump_lightning:
        description: "Whether to bump lightning"
        required: true
        default: false
        type: boolean
      bump_dumpling:
        description: "Whether to bump dumpling"
        required: true
        default: false
        type: boolean
      deploy_env:
        description: "Deploy Environment"
        required: true
        default: "dev"
        type: choice
        # please not change these options, they are used in the subsequent job:
        # 1. https://github.com/tidbcloud/aws-shared-provider/blob/main/.github/workflows/bump-tidb-version.yaml
        options:
          - dev
          - staging
          - prod
      cloud_provider:
        description: "Update for AWS, Alicloud, or both"
        required: true
        default: aws
        type: choice
        options:
          - aws
          - alicloud
          - both


jobs:
  bump-tidb-version:
    name: bump tidb version
    runs-on: self-hosted
    steps:
      - name: Invoke workflow in aws-shared-provider repo with inputs
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Bump the tidb version
          repo: tidbcloud/aws-shared-provider
          ref: refs/heads/master
          token: ${{ secrets.GIT_ACTION_BOT }}
          inputs: '{ "version": "${{ github.event.inputs.version }}", "env": "${{ github.event.inputs.deploy_env }}", "cloud_provider": "${{ github.event.inputs.cloud_provider }}", "action_url": "${{github.server_url}}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "bump_lightning": "${{ github.event.inputs.bump_lightning }}", "bump_dumpling": "${{ github.event.inputs.bump_dumpling }}", "author": "${{ github.actor }}" }'
